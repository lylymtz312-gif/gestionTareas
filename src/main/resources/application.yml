server:
  port: 8080

spring:
  datasource:
    url: jdbc:mysql://localhost:3306/task_db?useSSL=false&serverTimezone=UTC
    username: root
    password: secretpassword
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect

management:
  endpoints:
    web:
      exposure:
        include: health,info